version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: meetedge-postgres
    environment:
      POSTGRES_USER: meetedge
      POSTGRES_PASSWORD: meetedge_dev
      POSTGRES_DB: meetedge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetedge -d meetedge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meetedge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: meetedge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@meetedge.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
